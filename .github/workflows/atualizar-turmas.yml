name: Atualizar turmas do SIGAA

on:
  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

  # Executa automaticamente uma vez por dia
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scraper/requirements.txt

      - name: Executar testes
        run: |
          python -m pytest -v

      - name: Atualizar turmas
        run: |
          python -m scraper.scraper

      - name: Verificar alteracoes
        id: changes
        run: |
          git add public/data/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteracao nos dados."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Alteracoes encontradas nos dados."
          fi

      - name: Salvar dados atualizados
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "data: atualiza turmas do SIGAA"
          git push
