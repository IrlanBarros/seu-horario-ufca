name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  testes-python:
    name: Testes Python
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Executar testes Python
        run: |
          python -m pytest -v


  testes-frontend:
    name: Testes frontend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Executar Vitest
        run: npm test


  validar-frontend:
    name: Lint e build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

      - name: Gerar build de producao
        run: npm run build
